name: Linting

on: [push, pull_request]

jobs:
  linter:
    runs-on: ubuntu-latest
    container:
      image: ros:humble-ros-base
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: src/racerbot_a
      - name: Install clang tools & dependencies
        run: |
          apt-get update
          apt-get install -y clang-tidy
          rosdep update
          rosdep install -i --from-paths src --rosdistro humble -y

      - name: Compile and Run clang-tidy
        run: |
          . /opt/ros/humble/setup.bash
          # CMAKE_EXPORT_COMPILE_COMMANDS generates compile_commands.json needed for clang-tidy
          colcon build --symlink-install --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          
          # Run clang-tidy using the generated compilation database
          run-clang-tidy -p build/
    